# Probe misconfiguration: readiness probe hits port 9090 but container listens on 8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
data:
  APP_MODE: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
    raphael.scenario: probe-port-mismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=ok"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 5
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: APP_MODE
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
spec:
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 8080
