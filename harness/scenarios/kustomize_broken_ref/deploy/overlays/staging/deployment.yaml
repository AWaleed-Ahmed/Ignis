# Actual deployment file kept under the *old* name so kustomize cannot resolve
# deployment-renamed.yaml from kustomization.yaml (simulates rename without update).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
    raphael.scenario: kustomize-broken-ref
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=ok"]
          ports:
            - containerPort: 8080
