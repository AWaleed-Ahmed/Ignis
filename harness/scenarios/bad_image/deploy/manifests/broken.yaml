apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
data:
  APP_MODE: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
    raphael.scenario: bad-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:does-not-exist
          ports:
            - containerPort: 8080
